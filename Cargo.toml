# Virtual workspace root for Mote.
#
# Member crates live under `crates/`. The `[workspace.lints]` table below is the
# single source of truth for lint policy: every crate opts in with
# `[lints] workspace = true`, so quality rules are defined once and enforced
# everywhere. CI/pre-commit run clippy with `-D warnings`, turning every `warn`
# here into a hard failure while keeping local `cargo build` output readable.

[workspace]
resolver = "3"
members = ["crates/*"]
# Throwaway evaluation prototypes; not part of the product build.
exclude = ["spikes"]

# Metadata inherited by member crates via `field.workspace = true`.
[workspace.package]
edition = "2024"
rust-version = "1.95.0"
license = "Apache-2.0"
repository = "https://github.com/bamsammich/mote"
homepage = "https://github.com/bamsammich/mote"
authors = ["Travis Huddleston <travis@huddlehaus.com>"]

# Shared dependency versions live here and are referenced from member crates with
# `dep.workspace = true`. Populated as real crates are introduced.
[workspace.dependencies]
# Chromium Embedded Framework bindings (tauri-apps/cef-rs). The MAJOR tracks the
# Chromium major; the `+x.y.z` build metadata pins the exact CEF build. ONLY
# `mote-cef` may depend on this — see DISCIPLINES.md §1 (CEF upgrade discipline).
# Validated by the UI spike at 148.2.0 (Chromium 148); see
# docs/research/ui-spike-cef-html.md.
cef = "148.2.0"
# Windowing + GPU compositor stack (ADR-0004). winit owns the OS window/event
# loop (mote-shell); wgpu + raw-window-handle back the chrome+page texture
# compositor (mote-ui). Versions verified compatible: winit 0.30 exposes rwh
# 0.6, wgpu 29 consumes rwh 0.6 with a safe `create_surface`.
winit = "0.30"
wgpu = "29"
raw-window-handle = "0.6"
# Fast content-addressed plugin checksums (`blake3:<hex>`); see DESIGN §Integrity verification.
blake3 = "1.8"
# Ergonomic, idiomatic error enums for the shared vocabulary.
thiserror = "2.0"
# Secret-value wrapper: zeroizes on drop, redacting Debug impl.
# Used by mote-secrets for all resolved secret values.
secrecy = "0.10"
# Secure memory zeroing for secret values.
zeroize = "1.8"
# File encryption/decryption (identity-file backend). Default features only;
# no async, no passphrase, no SSH — D3 from the Phase-4 design doc.
age = "0.11"
# OS keyring via DBus Secret Service (GNOME Keyring / KDE Wallet on Linux).
# Features: sync-secret-service = DBus Secret Service protocol (no async, no
# OpenSSL — pure-Rust crypto); linux-native not used here (kernel keyring, not
# Secret Service). Versioned at the latest 3.x stable; 4.x has a different API.
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }

# --- Lint policy -------------------------------------------------------------
# rustc lints. Group lints use priority = -1 so specific overrides below win.
[workspace.lints.rust]
unsafe_code = "deny"                                 # opt back in per-crate (e.g. CEF FFI) with justification
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

# Clippy lints. Enable the strong groups, then relax the few that fight workspaces.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Internal crates don't carry crates.io metadata (keywords/categories).
cargo_common_metadata = "allow"
# Unavoidable with transitive dependencies; not actionable per-crate.
multiple_crate_versions = "allow"
# Noisy in a single-product workspace where the repetition aids readability.
module_name_repetitions = "allow"
# Conflicts with rustc's `unreachable_pub` (which we keep): satisfying one
# triggers the other. Disable the nursery lint; `unreachable_pub` is the policy.
redundant_pub_crate = "allow"

# Release profile tuned per the design doc's performance/footprint targets.
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
