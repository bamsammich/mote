# rustfmt configuration. Only stable options are set here so that
# `cargo fmt` is deterministic on the pinned stable toolchain (no nightly
# rustfmt warnings). Import grouping / granularity are nightly-only and
# deliberately left out.
edition = "2024"
max_width = 100
newline_style = "Unix"
use_small_heuristics = "Default"
use_field_init_shorthand = true
use_try_shorthand = true
