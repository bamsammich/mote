# Git hooks, run by lefthook. Every tool is invoked through `mise exec --` so the
# hooks use the exact pinned versions from mise.toml regardless of the caller's
# PATH. Install/refresh with `mise exec -- lefthook install`.

pre-commit:
  parallel: true
  commands:
    # Formatting must be applied, not just suggested — fail if anything is off.
    rustfmt:
      glob: "*.rs"
      run: mise exec -- cargo fmt --all --check
    # Lints as errors: the workspace lint policy is `warn`; `-D warnings`
    # promotes every warning (clippy + rustc) to a hard failure here.
    clippy:
      glob: "*.rs"
      run: mise exec -- cargo clippy --all-targets --all-features --workspace -- -D warnings
    # Canonical TOML formatting for Cargo.toml and friends.
    taplo:
      glob: "*.toml"
      run: mise exec -- taplo fmt --check {staged_files}
    # Spelling across code, comments, and docs.
    typos:
      run: mise exec -- typos
    # Chrome JS regression tests: Lane 1 component suite (real headless Chromium)
    # + node shims for pure-logic helpers (roving nav-math, panels.js helpers).
    #
    # The component suite serves crates/mote-ui/chrome/ over HTTP and renders
    # the golden fixture (__fixtures__/integrity_list.json) in real Chromium.
    # Fails loudly if node_modules is missing — never silently skips.
    chrome-js-tests:
      glob: "crates/mote-ui/chrome/**/*.{js,mjs,html,json}"
      run: >
        mise exec -- sh -c '
          if [ ! -d crates/mote-ui/node_modules ]; then
            echo "ERROR: crates/mote-ui/node_modules is missing." >&2
            echo "Run: cd crates/mote-ui && npm install" >&2
            exit 1
          fi
          cd crates/mote-ui &&
          node chrome/roving.test.js &&
          node chrome/panels.test.js &&
          npx playwright test --config playwright.component.mjs
        '

pre-push:
  commands:
    # The full test suite is the gate before code leaves the machine.
    test:
      run: mise exec -- cargo test --workspace --all-features
