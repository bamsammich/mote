[workspace]

[package]
name = "ui-egui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ui-egui"
path = "src/main.rs"

[dependencies]
# egui + wgpu renderer (pinned to Rust 1.95 compatible versions)
egui = "0.31"
egui-wgpu = "0.31"
# wgpu for offscreen rendering target
wgpu = "24"
# PNG output
image = { version = "0.25", features = ["png"] }
# Async runtime for wgpu device init
pollster = "0.4"
