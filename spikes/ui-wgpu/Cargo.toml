# Standalone throwaway spike crate — empty [workspace] keeps it out of the repo workspace.
[workspace]

[package]
name = "ui-wgpu-spike"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
wgpu = "29"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
glyphon = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
