[package]
name = "mote-lua"
description = "Sandboxed Lua runtime — embeds mlua/LuaJIT, removes io/os/debug/loadstring, loads a plugin module declaratively without calling setup(), and marshals the mote.* host-function surface into Lua."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
mlua = { version = "0.11.6", features = ["luajit", "vendored"] }
mote-types = { path = "../mote-types" }
thiserror.workspace = true
