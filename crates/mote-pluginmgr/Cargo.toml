[package]
name = "mote-pluginmgr"
description = "Plugin management and provenance — plugins.lua/plugins.lock resolution, source types, the content-addressed cache, BLAKE3 directory hashing, the mote plugin CLI surface, and per-plugin approved-permission tracking."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
mote-types = { path = "../mote-types" }
mote-lua = { path = "../mote-lua" }
thiserror = { workspace = true }
blake3 = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
include_dir = "0.7"
gix = { version = "0.84", default-features = false, features = [
  "blocking-network-client",
  "worktree-mutation",
  "revision",
  "sha1",
] }
tempfile = "3"
