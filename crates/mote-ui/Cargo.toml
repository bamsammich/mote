[package]
name = "mote-ui"
description = "Chrome rendering and widgets — the slot/element/theme rendering surface and runtime-owned UI (tab strip, urlbar host, sidebar, integrity panel, approval dialog). Rendering backend is gated on the UI-framework ADR."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The thin wgpu compositor (ADR-0003 / plan §1.1): blits the chrome + page OSR
# textures into the window. `raw-window-handle` is the window-handle seam from
# mote-shell; wgpu 29's `create_surface` is safe for it (no `unsafe`).
wgpu.workspace = true
raw-window-handle.workspace = true
thiserror.workspace = true
# Serialization: `ApprovalRequest` and its nested types are sent as JSON to
# chrome-side JS for DOM construction (ADR-0005 — no HTML strings cross the
# chrome boundary; the shell sends structured data instead).
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
