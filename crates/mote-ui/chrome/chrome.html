<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Content-Security-Policy (ADR-0005): the chrome document loads only its own
      bundled assets, served from this same `mote://chrome` origin. No remote
      scripts, no inline scripts (`script-src 'self'` excludes both unless an
      `'unsafe-inline'` token is added — it is not), no `unsafe-eval`. Style
      keeps `'unsafe-inline'` for TWO live reasons:
        1. panels.js's storage-bar sets a per-row computed `style="width:X%"`
           attribute (clamped numeric percentage, never plugin-supplied);
        2. the static status-line markup below carries a `style="color:
           var(--fg-2)"` attribute on the `.seg` tab-count row.
      Both must keep working — removing `'unsafe-inline'` from style-src here
      requires migrating BOTH paths (CSS custom properties + utility classes)
      and is tracked as a separate follow-up. `img-src data:` covers inline
      favicon placeholders. `object-src 'none'` blocks plugin elements;
      `base-uri 'self'` prevents `<base>` hijacking; `form-action 'none'`
      blocks form submissions out of the chrome.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'; connect-src 'self';"
    />
    <title>mote</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="components/kbd.css" />
    <link rel="stylesheet" href="components/button.css" />
    <link rel="stylesheet" href="components/field.css" />
    <link rel="stylesheet" href="components/card.css" />
    <link rel="stylesheet" href="components/badge.css" />
    <link rel="stylesheet" href="components/omnibox.css" />
    <link rel="stylesheet" href="components/tabs.css" />
    <link rel="stylesheet" href="components/status-line.css" />
    <link rel="stylesheet" href="components/palette.css" />
    <link rel="stylesheet" href="components/sidebar.css" />
    <link rel="stylesheet" href="components/empty-slot.css" />
    <link rel="stylesheet" href="components/integrity-panel.css" />
    <link rel="stylesheet" href="components/approval-dialog.css" />
    <link rel="stylesheet" href="components/tooltip.css" />
    <!--
      roving.js: shared list-navigation helper (CL-KBNAV). Pure nav-math plus a
      DOM attach factory; no cefQuery dependency. Loaded BEFORE host.js so
      window.mote.roving exists when host.js attaches the omnibox controller.
      host.js: the privileged chrome↔Rust bootstrap. Wraps window.cefQuery into
      window.mote.invoke (structured ops, never eval) and wires the omnibox to
      the `navigate` op. Deferred so the DOM exists before it binds listeners.
      panels.js: structured-DOM renderers for the integrity panel and the
      permission-approval dialog. Loaded AFTER host.js so its applyOp wrapper
      chains the base ops (set_tabs / set_url) through.
    -->
    <script src="roving.js" defer></script>
    <script src="mote-bridge.js" defer></script>
    <script src="host.js" defer></script>
    <script src="panels.js" defer></script>
  </head>

  <!--
    P1 chrome anatomy (ADR-0013 / ADR-0014 / ui-polish-phase-design.md §P1).

    The slot grid. `data-theme="dusk"` is the boot default; a theme switch is an
    instant CSS-var swap on this attribute. Each region is a `[data-slot]` div
    the runtime owns; structure inside a slot is owned by the bound element.

    Default layout (P1 revised):
      top-bar       = one 52px header row (workspace chip + omnibox + nav + actions)
      left-sidebar  = { activitybar + sidebar-panel:* }  (tabs panel default)
      right-sidebar = DROPPED from default theme (94px reclaimed by viewport)
      bottom-bar    = { status-indicator:* }              (the status line)
    The page <main> is transparent — the compositor blits the web view through.

    NO AI surfaces: the reserved assist sidebar panel and the reserved ask
    omnibox mode are names only (ADR-0002); nothing here binds them.

    Lucide sprite: all chrome icons are rendered via <use href="assets/lucide-sprite.svg#icon-<name>">
    in keycap buttons. The icon registry (ADR-0013) validates theme:set_icon
    calls in Rust; the HTML reads the sprite directly at display time.
  -->
  <body class="mote-root" data-theme="dusk">

    <!-- ====================== TOP BAR (P1: one 52px row) ====================
      Left:  [ws] Default › bracket-chip (keycap; opens workspace popover)
      Center: [url] omnibox with mode prefix
      Right of omnibox: [‹][›][↻] nav keycaps (disabled in P1; wired in P2)
      Far right: [⊕] new-tab · [🔖] bookmark · [✕] close-window
    -->
    <div data-slot="top-bar" class="chrome-header">

      <!-- Workspace bracket-chip (keycap construction; opens workspace popover) -->
      <button
        class="ws-chip keycap"
        role="button"
        aria-haspopup="listbox"
        aria-expanded="false"
        aria-label="workspace: default"
        data-tooltip="switch workspace"
      >
        <span class="ws-lockup lockup" aria-hidden="true">
          <span class="br">[</span><span class="name">ws</span><span class="br">]</span>
        </span>
        <span class="ws-name" aria-live="polite">default</span>
        <span class="ws-chevron" aria-hidden="true">›</span>
        <!-- P2: multi-workspace dot — visible when >1 workspace exists -->
        <span class="ws-multi-dot" aria-hidden="true"></span>
      </button>

      <!-- Omnibox: full-width, centers between the chip and action buttons -->
      <form class="omnibar-row" role="search" aria-label="omnibox">
        <div class="omni mode-url">
          <span class="mode lockup" aria-hidden="true">
            <span class="br">[</span><span class="name">url</span><span class="br">]</span>
          </span>
          <div class="body">
            <span class="secure" aria-label="connection">⎈</span>
            <!--
              CL-URL-XPARENCY A8: unfocused display layer (Safari/Chrome pattern).
              The omnibox is a plain <input> that cannot style spans inside it, so
              the editable input and a read-only styled overlay share one slot.
              The overlay (.omni-url-display) is absolutely positioned on top of
              the input; host.js renders registrable-domain emphasis into it via
              createElement+textContent — NEVER innerHTML; the URL parts are
              page-derived. When unfocused with a display payload the input text
              goes transparent (.is-display-layer) and the overlay shows; on focus
              the overlay hides and the raw input shows for editing. The overlay is
              aria-hidden so the input stays the single accessible address surface.
            -->
            <span class="omni-url-slot">
              <input
                id="omnibox-input"
                class="omni-input"
                type="text"
                spellcheck="false"
                autocomplete="off"
                aria-label="address"
                placeholder="enter a url"
                role="combobox"
                aria-autocomplete="list"
                aria-controls="omnibox-completions"
                aria-expanded="false"
              />
              <span
                id="omnibox-url-display"
                class="omni-url-display"
                aria-hidden="true"
              ></span>
            </span>
            <!--
              CL-URL-XPARENCY A9: tracker-count chip (right region). Hidden until
              the shell pushes trackers via set_url; text set from trackers.count
              in host.js. Subtle --danger accent dot, never a loud badge.
            -->
            <span class="right">
              <span
                id="omnibox-trackers-chip"
                class="omni-trackers-chip"
                hidden
              ></span>
            </span>
          </div>
        </div>
        <div
          id="omnibox-completions"
          class="omni-completions"
          role="listbox"
          aria-label="url suggestions"
        >
          <!-- rows are appended by host.js via DOM-build (never innerHTML) -->
        </div>
      </form>

      <!-- Nav keycap group: [‹] [›] [↻]
           Disabled in P1 (wired to CEF in P2). Rendered as disabled keycaps
           with aria-disabled and tooltips explaining availability. -->
      <div class="header-nav-group" role="group" aria-label="navigation">
        <button
          class="keycap btn btn-ghost btn-icon nav-btn"
          aria-label="go back"
          aria-disabled="true"
          data-tooltip="go back"
          data-tooltip-kbd="⌘["
        >
          <svg class="icon" aria-hidden="true">
            <use href="assets/lucide-sprite.svg#icon-arrow-left"/>
          </svg>
        </button>
        <button
          class="keycap btn btn-ghost btn-icon nav-btn"
          aria-label="go forward"
          aria-disabled="true"
          data-tooltip="go forward"
          data-tooltip-kbd="⌘]"
        >
          <svg class="icon" aria-hidden="true">
            <use href="assets/lucide-sprite.svg#icon-arrow-right"/>
          </svg>
        </button>
        <button
          class="keycap btn btn-ghost btn-icon nav-btn"
          aria-label="reload"
          aria-disabled="true"
          data-tooltip="reload"
          data-tooltip-kbd="⌘R"
        >
          <svg class="icon" aria-hidden="true">
            <use href="assets/lucide-sprite.svg#icon-rotate-cw"/>
          </svg>
        </button>
      </div>

      <!-- Right action group: [⊕] · [🔖] · [✕] -->
      <div class="header-actions" role="group" aria-label="browser actions">

        <!-- [⊕] new tab -->
        <button
          type="button"
          class="keycap btn btn-ghost btn-icon new-tab-btn"
          data-action="new-tab"
          aria-label="new tab"
          data-tooltip="new tab"
          data-tooltip-kbd="⌘T"
        >
          <svg class="icon" aria-hidden="true">
            <use href="assets/lucide-sprite.svg#icon-plus"/>
          </svg>
        </button>

        <!-- [🔖] bookmark current page -->
        <button
          type="button"
          class="keycap btn btn-ghost btn-icon bookmark-toggle"
          aria-label="bookmark page"
          aria-pressed="false"
          data-tooltip="bookmark page"
          data-tooltip-kbd="⌘D"
        >
          <svg class="icon" aria-hidden="true">
            <use href="assets/lucide-sprite.svg#icon-bookmark"/>
          </svg>
        </button>

        <!-- [✕] close window (R4; wire complete) -->
        <button
          type="button"
          class="keycap btn btn-ghost btn-icon close-window-btn"
          aria-label="close window"
          data-tooltip="close window"
          data-tooltip-kbd="⌘⇧W"
        >
          <svg class="icon" aria-hidden="true">
            <use href="assets/lucide-sprite.svg#icon-x"/>
          </svg>
        </button>
      </div>

      <!-- Workspace popover: below the ws-chip -->
      <div
        id="workspace-popover"
        class="workspace-popover"
        role="listbox"
        aria-label="workspaces"
        hidden
      >
        <!-- rows appended by host.js applyOp('workspace_list', …) -->
      </div>
    </div><!-- /.chrome-header -->

    <!-- ========================= BODY ROW ========================= -->
    <div class="mote-body">

      <!-- left-sidebar: tabs panel bound by default.
           P1: activitybar has 5 rail slots (3 first-party + 2 plugin placeholders)
           + collapse button at bottom. The workspace strip has moved to the header. -->
      <aside data-slot="left-sidebar" class="sidebar" aria-label="sidebar">
        <div class="sidebar-body">

          <!-- Activity bar / rail: 5 icon slots + spacer + collapse -->
          <nav class="activitybar" aria-label="sidebar panels">

            <!-- Slot 1: tabs (rail.tabs, default: layers) -->
            <button
              class="activity-btn is-active"
              aria-label="tabs"
              aria-pressed="true"
              data-tooltip="tabs"
            >
              <svg class="icon" aria-hidden="true">
                <use href="assets/lucide-sprite.svg#icon-layers"/>
              </svg>
            </button>

            <!-- Slot 2: bookmarks (rail.bookmarks, default: bookmark) -->
            <button
              class="activity-btn"
              aria-label="bookmarks"
              aria-pressed="false"
              data-tooltip="bookmarks"
            >
              <svg class="icon" aria-hidden="true">
                <use href="assets/lucide-sprite.svg#icon-bookmark"/>
              </svg>
            </button>

            <!-- Slot 3: history (rail.history, default: clock) -->
            <button
              class="activity-btn"
              aria-label="history"
              aria-pressed="false"
              data-tooltip="history"
            >
              <svg class="icon" aria-hidden="true">
                <use href="assets/lucide-sprite.svg#icon-clock"/>
              </svg>
            </button>

            <!-- Slot 4: settings (rail.settings, P6) — ADR-0017 -->
            <button
              class="activity-btn"
              aria-label="settings"
              aria-pressed="false"
              data-tooltip="settings"
              data-action="open-settings"
              data-rail-slot="settings"
            >
              <svg class="icon" aria-hidden="true">
                <use href="assets/lucide-sprite.svg#icon-settings"/>
              </svg>
            </button>

            <!-- Slot 5: plugin placeholder (rail.plugin_unbound) — ADR-0014 -->
            <button
              class="activity-btn rail-plugin-placeholder"
              aria-label="available plugin panel slot"
              aria-pressed="false"
              data-tooltip="available — plugins can add panels here"
              data-rail-slot="plugin-5"
            >
              <svg class="icon" aria-hidden="true">
                <use href="assets/lucide-sprite.svg#icon-circle-plus"/>
              </svg>
            </button>

            <div class="activitybar-spacer"></div>

            <!-- Collapse sidebar (bottom of rail) -->
            <button
              class="activity-btn collapse-sidebar-btn"
              aria-label="collapse sidebar"
              aria-pressed="false"
              data-tooltip="collapse sidebar"
            >
              <svg class="icon" aria-hidden="true">
                <use href="assets/lucide-sprite.svg#icon-panel-left-close"/>
              </svg>
            </button>
          </nav>

          <!-- Side panel: tabbed content area -->
          <div class="sidepanel">
            <header class="sidepanel-head">
              <!-- [tabs] bracket lockup + count chip (P1: just "3", no "open") -->
              <span class="sidepanel-slot lockup" aria-live="polite">
                <span class="br">[</span><span class="name">tabs</span><span class="br">]</span>
              </span>
              <span class="sidepanel-head-right">
                <!-- Count chip: shows just the number (e.g. "3") -->
                <span class="tab-count-chip" aria-label="open tab count">0</span>
              </span>
            </header>

            <div class="sidepanel-body">
              <div data-panel="tabs" class="is-active-panel">
                <!--
                  tab-row: the tabstrip element. Vertical theme variant stacks rows.
                  P1: .favicon uses the dot-grid motif (not a checkbox).
                  Active tab: 2px var(--accent) left-stripe + surface-2 bg lift.
                  Close X: hover-only via .tab-close (keycap construction in CSS).
                -->
                <div data-slot="tab-row">
                  <div
                    id="tabstrip"
                    class="tabbar theme-vertical"
                    role="tablist"
                    aria-label="open tabs"
                  >
                    <!-- host.js rebuilds these rows from the runtime tab list. A
                         single seed row keeps the panel non-empty before first
                         paint. -->
                    <div class="tab is-active" role="tab" aria-selected="true">
                      <span class="favicon favicon-placeholder" aria-hidden="true"></span>
                      <span class="title">new tab</span>
                      <button class="tab-close" aria-label="close tab" tabindex="-1">
                        <svg class="icon" aria-hidden="true">
                          <use href="assets/lucide-sprite.svg#icon-x"/>
                        </svg>
                      </button>
                    </div>
                  </div>
                </div>

                <!-- Empty zone below tab list: faint dot-grid motif at 20% opacity
                     signals "intentional space." Per spec/components/empty-slot.md. -->
                <div class="sidebar-empty-zone" aria-hidden="true"></div>
              </div>

              <div data-panel="bookmarks">
                <!-- rows rendered by host.js applyOp("bookmark_list", …) -->
              </div>
              <div data-panel="history">
                <!-- rows rendered by host.js applyOp("history_list", …) -->
              </div>
            </div>
          </div><!-- /.sidepanel -->

        </div><!-- /.sidebar-body -->
      </aside>

      <!-- Viewport: the page region is transparent; compositor blits through it.
           P1: right-sidebar is removed from default theme so the viewport
           extends to the right edge of the window (ADR-0014 §right slot). -->
      <main class="mote-page" data-slot="viewport" aria-label="page"></main>

      <!-- Right sidebar INTENTIONALLY ABSENT from the default theme per ADR-0014.
           Plugins / custom themes can re-declare it. The 94px is reclaimed by
           the viewport's `flex: 1` expansion in base.css. -->

    </div><!-- /.mote-body -->

    <!-- ========================= BOTTOM BAR ========================= -->
    <div data-slot="bottom-bar">
      <!--
        Three-zone status line (ADR-0016). Left, center, and right zones each
        hold `data-sl-el` segments populated by `set_statusline_elements`
        applyOp from the shell. Built-in elements (mote.security,
        mote.tabcount) are seeded here as static defaults; the shell push
        replaces them once the runtime is up. (mote.mode — vim NORMAL/INSERT —
        is plugin-provided, not core; ADR-0019.) Zone separators (`·`) are
        rendered in CSS via ::before on `.sl-sep`.
      -->
      <div class="sl" role="status" aria-live="polite">
        <!-- Left zone: mote.security. (mote.mode — vim NORMAL/INSERT — is NOT a
             core element; the editing-paradigm plugin provides it, ADR-0019.) -->
        <div class="sl-zone sl-zone--left" data-sl-zone="left">
          <div class="sl-el sl-icon-text" data-sl-el="mote.security" aria-label="connection secure">
            <svg class="sl-icon" aria-hidden="true" width="12" height="12">
              <use href="assets/lucide-sprite.svg#icon-lock"/>
            </svg>
            <span>https · tls 1.3</span>
          </div>
        </div>
        <!-- Center zone: plugin elements land here -->
        <div class="sl-zone sl-zone--center" data-sl-zone="center"></div>
        <!-- Right zone: mote.tabcount (priority 50) -->
        <div class="sl-zone sl-zone--right" data-sl-zone="right">
          <div class="sl-el" data-sl-el="mote.tabcount" style="color: var(--fg-2)">0 tabs</div>
        </div>
      </div>
    </div>

    <!--
      Mount roots for the integrity panel (Ctrl+Shift+I) and the permission
      approval dialog. Both are populated by panels.js from JSON the shell
      pushes via window.mote.applyOp — never as HTML strings.
    -->
    <div
      id="mote-integrity-root"
      class="chrome-overlay"
      hidden
      aria-hidden="true"
    ></div>
    <div
      id="mote-approval-root"
      class="chrome-overlay"
      hidden
      aria-hidden="true"
    ></div>

    <!--
      Command palette overlay (widget kind). Hidden until invoked (⌘⇧P).
    -->
    <template id="palette-template">
      <div
        class="palette-backdrop"
        role="dialog"
        aria-modal="true"
        aria-label="command palette"
      >
        <div class="palette">
          <div class="palette-input">
            <span class="prompt">›_</span>
            <input value="" placeholder="search commands" aria-label="command palette" />
            <span class="count">0</span>
          </div>
          <div class="palette-list" role="listbox">
          </div>
        </div>
      </div>
    </template>
  </body>
</html>
