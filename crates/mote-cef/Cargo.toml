[package]
name = "mote-cef"
description = "CEF isolation wrapper — the only crate permitted to import cef/cef_rs; wraps the Chromium Embedded Framework lifecycle, browser hosts, resource hooks, and isolated worlds behind safe Rust types."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The ONLY place in the workspace `cef` may appear. See DISCIPLINES.md §1.
cef.workspace = true
thiserror.workspace = true
# Proper, object-anchored JSON parsing on the host-bridge request path (replaces
# the prior hand-rolled first-substring field extractors). Crate-local dep.
serde_json = "1.0"

[dev-dependencies]
# `osr_smoke` example writes the first painted frame to a PNG as run-evidence.
image = { version = "0.25", default-features = false, features = ["png"] }

# The `osr_smoke` example drives the full CEF process/subprocess split itself; it
# is the integration "test" CEF can't be hosted by a plain `#[test]`.
[[example]]
name = "osr_smoke"
path = "examples/osr_smoke.rs"
