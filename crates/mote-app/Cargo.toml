[package]
name = "mote-app"
description = "The Mote binary — parses args, dispatches to the CLI (management subcommands) or boots the browser shell, and owns the CEF subprocess entry shim required by Chromium's multi-process model."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "mote"
path = "src/main.rs"

[dependencies]
# The CEF process-split shim must run first in main (DISCIPLINES §1: only
# mote-cef touches cef; mote-app goes through its API).
mote-cef = { path = "../mote-cef" }
# The browser composition root the browser process boots.
mote-shell = { path = "../mote-shell" }
# The management CLI surface (plugin/secrets subcommands).
mote-cli = { path = "../mote-cli" }
