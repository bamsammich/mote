[package]
name = "mote-runtime"
description = "Plugin lifecycle orchestrator — drives the four-step load pipeline, owns the live plugin table and capability fulfillment map, handles hot reload, and assembles the mote.* host API exposed through the language runtimes."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
mote-audit = { version = "0.0.0", path = "../mote-audit" }
mote-dispatch = { version = "0.0.0", path = "../mote-dispatch" }
mote-lua = { version = "0.0.0", path = "../mote-lua" }
mote-permissions = { version = "0.0.0", path = "../mote-permissions" }
mote-registry = { version = "0.0.0", path = "../mote-registry" }
mote-storage = { version = "0.0.0", path = "../mote-storage" }
mote-types = { version = "0.0.0", path = "../mote-types" }
serde = { version = "1.0", features = ["derive"] }
thiserror.workspace = true

[dev-dependencies]
serde_json = "1.0"
