[package]
name = "mote-registry"
description = "Versioned permission/capability/token registries — loads and validates the machine-readable registry files, resolves a plugin's targeted schema version, and provides capability-contract descriptors for load-time conformance checks."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
mote-lua = { version = "0.0.0", path = "../mote-lua" }
mote-permissions = { version = "0.0.0", path = "../mote-permissions" }
mote-types = { version = "0.0.0", path = "../mote-types" }
serde = { version = "1.0.228", features = ["derive"] }
thiserror.workspace = true
toml = "1.1.2"
