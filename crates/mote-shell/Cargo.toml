[package]
name = "mote-shell"
description = "Browser composition root — wires runtime, session, UI, secrets, pluginmgr, and MCP into a browser: window/tab management, the init.lua config loader, and the event-loop integration where the integration seams live."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The window + event loop (ADR-0004). The shell is the single OS event source.
winit.workspace = true
# The window-handle seam handed to the compositor (mote-ui owns the surface).
raw-window-handle.workspace = true
# CEF lifecycle / pages / host bridge — the ONLY crate that may touch cef is
# mote-cef; the shell goes through its safe API (DISCIPLINES §1).
mote-cef = { path = "../mote-cef" }
# The compositor + chrome assets (slot/element/theme model + materialized CSS).
mote-ui = { path = "../mote-ui" }
# Session/tab state (the three-axis model) + per-identity SQLite persistence.
# The shell owns lifecycle + flush/restore timing; these crates own the state.
mote-session = { path = "../mote-session" }
mote-storage = { path = "../mote-storage" }
mote-types = { path = "../mote-types" }
# The Phase-1 plugin runtime: the shell instantiates it at startup and loads the
# bundled first-party plugins through the four-step pipeline. The shell consumes
# its public introspection API only (RunningPlugin); it never edits the runtime.
mote-runtime = { path = "../mote-runtime" }
# The append-only audit log + producer fed into the runtime and queried for the
# integrity panel's recent-activity / denials sections.
mote-audit = { path = "../mote-audit" }
# The permission/capability/event registry the runtime validates plugins against.
mote-registry = { path = "../mote-registry" }
# Plugin management (ApprovalStore, Provenance, diff) + the lua manifest loader
# used by the install→approval brain (Task 2 / ADR-0007).
mote-pluginmgr = { path = "../mote-pluginmgr" }
# Secret resolver: backend-label lookup and the empty resolver fallback used
# when the shell cannot load secrets.lua (e.g. parse error at boot).
mote-secrets = { path = "../mote-secrets" }
mote-lua = { path = "../mote-lua" }
mote-permissions = { path = "../mote-permissions" }
# Ergonomic error enums for ClassifyError.
thiserror = { workspace = true }
# Serde + derive for DialogResult deserialization.
serde = { version = "1.0", features = ["derive"] }
# Proper, object-anchored JSON parsing of the chrome bootstrap's op `params`
# (replaces the hand-rolled first-substring field extractors). Crate-local dep.
serde_json = "1.0"
# System clipboard (R2: copy_active_url op writes the active tab's URL).
arboard = { workspace = true }
# Public Suffix List for omnibox URL-vs-search determination (ADR-0018).
psl.workspace = true

[dev-dependencies]
# Tempdirs for headless PluginHost boot tests (config/cache dirs + path plugins).
tempfile = "3"
