[package]
name = "mote-shell"
description = "Browser composition root — wires runtime, session, UI, secrets, pluginmgr, and MCP into a browser: window/tab management, the init.lua config loader, and the event-loop integration where the integration seams live."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The window + event loop (ADR-0004). The shell is the single OS event source.
winit.workspace = true
# The window-handle seam handed to the compositor (mote-ui owns the surface).
raw-window-handle.workspace = true
# CEF lifecycle / pages / host bridge — the ONLY crate that may touch cef is
# mote-cef; the shell goes through its safe API (DISCIPLINES §1).
mote-cef = { path = "../mote-cef" }
# The compositor + chrome assets (slot/element/theme model + materialized CSS).
mote-ui = { path = "../mote-ui" }
