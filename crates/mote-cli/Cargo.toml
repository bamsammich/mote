[package]
name = "mote-cli"
description = "The mote command-line surface — mote plugin …, mote secrets link, etc. Thin; delegates to mote-pluginmgr/mote-secrets and can run without launching the engine."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
mote-pluginmgr = { path = "../mote-pluginmgr" }
mote-storage = { path = "../mote-storage" }
mote-types = { path = "../mote-types" }
clap = { version = "4", features = ["derive"] }
thiserror = { workspace = true }

[dev-dependencies]
mote-lua = { path = "../mote-lua" }
tempfile = "3"
